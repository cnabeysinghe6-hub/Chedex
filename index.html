<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10201d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Chedex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column built for a phone. Week strip on top, a dark progress card,
   the day's plan grouped by morning/afternoon/evening, and a composer pinned to the bottom. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --ink: #10201d;
  --muted: #5b6a65;
  --line: #dbe2df;
  --ring: #8f9e99;
  --accent: #f2c230;
  --accent-ink: #10201d;
  --hero-bg: #10201d;
  --hero-fg: #f2f5f3;
  --hero-track: #2c4640;
  --danger: #b3382c;
  --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1412; --surface: #14211e; --ink: #e8f0ed; --muted: #9db0aa; --line: #243732;
    --ring: #5f726c; --accent: #f2c230; --accent-ink: #10201d; --hero-bg: #1c312c;
    --hero-fg: #eef5f2; --hero-track: #33514a; --danger: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1412; --surface: #14211e; --ink: #e8f0ed; --muted: #9db0aa; --line: #243732;
  --ring: #5f726c; --accent: #f2c230; --accent-ink: #10201d; --hero-bg: #1c312c;
  --hero-fg: #eef5f2; --hero-track: #33514a; --danger: #ff8a7a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 16px 190px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark {
  width: 34px; height: 34px; border-radius: 9px; background: #10201d; color: #f2c230;
  display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px;
}
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
.status { font-size: 12px; color: var(--muted); text-align: right; }

/* week strip */
.week { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.nav {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center;
}
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day {
  border: 0; background: transparent; border-radius: 12px; padding: 8px 0; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  position: relative;
}
.day .dow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.day .num { font-family: var(--display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.day[aria-pressed="true"] .dow { color: inherit; opacity: 0.75; }
.day.today::after {
  content: ""; position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}

/* summary */
.hero {
  background: var(--hero-bg); color: var(--hero-fg); border-radius: 20px; padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.hero-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.hero .date { font-size: 13px; opacity: 0.8; }
.hero .when { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; line-height: 1.1; }
.count { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.count small { font-size: 15px; font-weight: 600; opacity: 0.75; margin-left: 4px; }
.track { height: 8px; border-radius: 99px; background: var(--hero-track); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
.next { font-size: 14px; opacity: 0.9; min-height: 20px; }
.next b { font-family: var(--mono); font-weight: 500; }

.notice {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border: 1px dashed var(--ring); border-radius: 14px; padding: 10px 14px; font-size: 14px; color: var(--muted);
}
.link { background: none; border: 0; padding: 4px 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }

/* list */
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 {
  margin: 8px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
}
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 12px 12px;
}
.check {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ring); background: transparent;
  display: grid; place-items: center; padding: 0; color: transparent;
}
.check svg { width: 16px; height: 16px; }
.row.done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.t { font-weight: 500; overflow-wrap: anywhere; }
.row.done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 3px; font-size: 13px; color: var(--muted); }
.time { font-family: var(--mono); font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.row.done .time { color: var(--muted); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.tag.next-tag { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.del {
  min-width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; color: var(--muted); font-size: 22px; line-height: 1;
}
.del.arm { color: var(--danger); font-size: 13px; font-weight: 600; padding: 0 8px; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; border: 1px dashed var(--line); border-radius: 16px; }
.empty b { display: block; color: var(--ink); font-family: var(--display); font-size: 20px; margin-bottom: 4px; }

/* composer */
.composer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.composer form { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.line { display: flex; gap: 8px; align-items: stretch; }
.line > * { min-width: 0; }
.field {
  flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 0 14px; min-height: 48px;
}
.field::placeholder { color: var(--muted); }
.timef { flex: 0 0 auto; width: 130px; font-family: var(--mono); font-size: 15px; }
.chip {
  flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; min-height: 48px; padding: 0 14px;
  font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.add {
  flex: 0 0 auto; min-width: 84px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; padding: 0 18px;
}

@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">C</div><h1>Chedex</h1></div>
    <div class="status" id="status" role="status"></div>
  </header>

  <nav class="week" aria-label="Choose a day">
    <button class="nav" id="prev" aria-label="Previous week" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="days" id="days"></div>
    <button class="nav" id="nextw" aria-label="Next week" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>

  <section class="hero" aria-label="Progress for this day">
    <div class="hero-head">
      <div>
        <div class="date" id="date"></div>
        <div class="when" id="when"></div>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="next" id="nextline"></div>
  </section>

  <div class="notice" id="notice" hidden>
    <span>The tasks shown are samples so you can see how it works.</span>
    <button class="link" id="clear" type="button">Clear samples</button>
  </div>

  <main id="list"></main>
</div>

<div class="composer">
  <form id="add" autocomplete="off">
    <div class="line">
      <input class="field" id="title" type="text" placeholder="Add a task or routine" aria-label="Task name" maxlength="120">
      <button class="add" type="submit">Add</button>
    </div>
    <div class="line">
      <input class="field timef" id="time" type="time" aria-label="Time (optional)">
      <button class="chip" id="repeat" type="button" aria-pressed="false">Repeat every day</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'chedex-state-v1';

  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var addDays = function (s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  var uid = function () { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmtTime = function (t) {
    if (!t) return '';
    var p = t.split(':'), h = +p[0], m = p[1];
    return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
  };
  var part = function (t) {
    if (!t) return 'any';
    var h = +t.split(':')[0];
    return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  };
  var PART_LABEL = { any: 'Anytime', morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening' };

  function sample() {
    var t = ymd(new Date());
    var mk = function (title, time, repeat) {
      return { id: uid(), title: title, time: time, repeat: repeat, date: t, since: t, example: true };
    };
    return {
      items: [
        mk('Wake up and drink water', '05:30', true),
        mk('Exercise', '06:00', true),
        mk('Tuition class', '08:00', false),
        mk('Lunch', '13:00', true),
        mk('Chemistry past paper', '16:00', false),
        mk('Pack bag for tomorrow', '', false),
        mk('Phone off, sleep', '22:00', true)
      ],
      done: {}
    };
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s && Array.isArray(s.items) && s.done && typeof s.done === 'object') return s;
    } catch (e) {}
    return null;
  }
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var state = loadLocal() || sample();
  var selected = ymd(new Date());
  var armedId = null, armTimer = null;

  var el = function (id) { return document.getElementById(id); };

  /* ---------- sync ---------- */
  var dbDoc = null, canSync = true, dirty = false, saving = false, flushTimer = null;

  function setStatus(msg) { el('status').textContent = msg; }

  function queueRemote() {
    if (!dbDoc || !canSync) return;
    dirty = true;
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 600);
  }
  function flush() {
    if (!dbDoc || !canSync || !dirty) return;
    if (saving) { flushTimer = setTimeout(flush, 400); return; }
    saving = true; dirty = false;
    dbDoc.set({ state: JSON.stringify(state), savedAt: Date.now() }).then(function () {
      setStatus('Saved to your account');
    }).catch(function () {
      canSync = false;
      setStatus('Saved on this device only');
    }).then(function () {
      saving = false;
      if (dirty) queueRemote();
    });
  }
  function changed() { saveLocal(); render(); queueRemote(); }

  /* ---------- data helpers ---------- */
  function itemsFor(day) {
    return state.items.filter(function (i) { return i.repeat ? day >= i.since : i.date === day; })
      .sort(function (a, b) {
        if (a.time !== b.time) return (a.time || '99:99') < (b.time || '99:99') ? -1 : 1;
        return a.title.localeCompare(b.title);
      });
  }
  function isDone(day, id) { return (state.done[day] || []).indexOf(id) !== -1; }
  function toggle(day, id) {
    var list = state.done[day] || [];
    var k = list.indexOf(id);
    if (k === -1) list.push(id); else list.splice(k, 1);
    state.done[day] = list;
    changed();
  }
  function remove(id) {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    Object.keys(state.done).forEach(function (d) {
      state.done[d] = state.done[d].filter(function (x) { return x !== id; });
    });
    armedId = null;
    changed();
  }

  /* ---------- render ---------- */
  function dayLabel(day, today) {
    if (day === today) return 'Today';
    if (day === addDays(today, 1)) return 'Tomorrow';
    if (day === addDays(today, -1)) return 'Yesterday';
    return parse(day).toLocaleDateString('en-GB', { weekday: 'long' });
  }

  function render() {
    var today = ymd(new Date());
    var d = parse(selected);
    var dow = (d.getDay() + 6) % 7;
    var start = addDays(selected, -dow);

    var strip = '';
    for (var i = 0; i < 7; i++) {
      var ds = addDays(start, i), dd = parse(ds);
      strip += '<button type="button" class="day' + (ds === today ? ' today' : '') + '" data-day="' + ds + '" aria-pressed="' + (ds === selected) + '">' +
        '<span class="dow">' + dd.toLocaleDateString('en-GB', { weekday: 'short' }).slice(0, 3) + '</span>' +
        '<span class="num">' + dd.getDate() + '</span></button>';
    }
    el('days').innerHTML = strip;

    var items = itemsFor(selected);
    var doneCount = items.filter(function (i) { return isDone(selected, i.id); }).length;

    el('date').textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    el('when').textContent = dayLabel(selected, today);
    el('count').innerHTML = doneCount + '<small>of ' + items.length + ' done</small>';
    el('fill').style.width = (items.length ? Math.round(doneCount / items.length * 100) : 0) + '%';

    var nextId = null;
    if (selected === today) {
      var now = pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());
      var nx = items.filter(function (i) { return i.time && i.time >= now && !isDone(selected, i.id); })[0];
      if (nx) nextId = nx.id;
      el('nextline').innerHTML = nx ? 'Next: <b>' + fmtTime(nx.time) + '</b> ' + esc(nx.title) :
        (items.length && doneCount === items.length ? 'Everything is done for today.' : '');
    } else {
      el('nextline').textContent = '';
    }

    el('notice').hidden = !state.items.some(function (i) { return i.example; });

    if (!items.length) {
      el('list').innerHTML = '<div class="empty"><b>Nothing planned</b>Type a task below and tap Add. Turn on Repeat every day for routines.</div>';
      return;
    }
    var html = '';
    ['any', 'morning', 'afternoon', 'evening'].forEach(function (p) {
      var g = items.filter(function (i) { return part(i.time) === p; });
      if (!g.length) return;
      html += '<section class="group"><h2>' + PART_LABEL[p] + '</h2><ul class="rows">';
      g.forEach(function (i) {
        var done = isDone(selected, i.id);
        var armed = armedId === i.id;
        html += '<li class="row' + (done ? ' done' : '') + '" data-id="' + i.id + '">' +
          '<button type="button" class="check" data-check role="checkbox" aria-checked="' + done + '" aria-label="Done: ' + esc(i.title) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>' +
          '<div><div class="t">' + esc(i.title) + '</div><div class="meta">' +
          (i.time ? '<span class="time">' + fmtTime(i.time) + '</span>' : '') +
          (i.repeat ? '<span class="tag">Daily</span>' : '') +
          (i.example ? '<span class="tag">Sample</span>' : '') +
          (i.id === nextId ? '<span class="tag next-tag">Next</span>' : '') +
          '</div></div>' +
          '<button type="button" class="del' + (armed ? ' arm' : '') + '" data-del aria-label="Delete ' + esc(i.title) + '">' + (armed ? 'Delete?' : '&times;') + '</button></li>';
      });
      html += '</ul></section>';
    });
    el('list').innerHTML = html;
  }

  /* ---------- events ---------- */
  el('days').addEventListener('click', function (e) {
    var b = e.target.closest('[data-day]');
    if (!b) return;
    selected = b.getAttribute('data-day');
    armedId = null;
    render();
  });
  el('prev').addEventListener('click', function () { selected = addDays(selected, -7); armedId = null; render(); });
  el('nextw').addEventListener('click', function () { selected = addDays(selected, 7); armedId = null; render(); });

  el('list').addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (!row) return;
    var id = row.getAttribute('data-id');
    if (e.target.closest('[data-check]')) { toggle(selected, id); return; }
    if (e.target.closest('[data-del]')) {
      if (armedId === id) { clearTimeout(armTimer); remove(id); return; }
      armedId = id;
      render();
      clearTimeout(armTimer);
      armTimer = setTimeout(function () { armedId = null; render(); }, 3000);
    }
  });

  el('clear').addEventListener('click', function () {
    state.items = state.items.filter(function (i) { return !i.example; });
    changed();
  });

  var repeatOn = false;
  el('repeat').addEventListener('click', function () {
    repeatOn = !repeatOn;
    el('repeat').setAttribute('aria-pressed', String(repeatOn));
  });

  el('add').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = el('title').value.trim();
    if (!title) { el('title').focus(); return; }
    state.items.push({
      id: uid(), title: title, time: el('time').value || '', repeat: repeatOn,
      date: selected, since: selected
    });
    el('title').value = '';
    el('time').value = '';
    repeatOn = false;
    el('repeat').setAttribute('aria-pressed', 'false');
    el('title').focus();
    changed();
  });

  /* ---------- start ---------- */
  render();
  setStatus('Saved on this device');

  // keep "Next" fresh while the page stays open
  setInterval(function () { if (selected === ymd(new Date())) render(); }, 60000);

  // account sync (optional: the page works fully without it)
  (function initSync() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        dbDoc = db.doc('data/users/' + id + '/chedex');
        var loadTimer = setTimeout(function () { setStatus('Saved on this device. Sync not reached yet.'); }, 10000);
        dbDoc.onSnapshot(function (snap) {
          if (snap.metadata.fromCache) return;
          clearTimeout(loadTimer);
          if (snap.metadata.hasPendingWrites || saving || dirty) return;
          setStatus('Saved to your account');
          if (!snap.exists) return;
          var data = snap.data();
          var s = data && data.state;
          if (typeof s !== 'string' || s === JSON.stringify(state)) return;
          try {
            var parsed = JSON.parse(s);
            if (parsed && Array.isArray(parsed.items) && parsed.done) { state = parsed; saveLocal(); render(); }
          } catch (e) {}
        }, function () { clearTimeout(loadTimer); setStatus('Saved on this device'); });
      });
    }).catch(function () {});
  })();
})();
</script>

</html>
